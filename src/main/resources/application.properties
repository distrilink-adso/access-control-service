# ===== access-control-service (Sebastián Calderón) =====
spring.application.name=access-control-service
server.port=8081

# ----- Base de datos propia de este microservicio -----
# El usuario y la clave NO se escriben aqui: se leen de variables de entorno.
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ----- JPA: Hibernate SOLO valida, nunca crea ni modifica tablas -----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# ----- Flyway: crea las tablas con los scripts de src/main/resources/db/migration -----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ----- Swagger -----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ----- Actuator -----
management.endpoints.web.exposure.include=health,info

# ----- CORS: origenes permitidos del frontend -----
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500

# ----- JWT (RS256) -----
# Quien emite el token: los otros servicios lo verifican.
app.jwt.issuer=distrilink-access-control
# Duracion del token en minutos.
app.jwt.expiration-minutes=60
# Rutas a las llaves en formato PEM (ver README). Si se dejan vacias, se genera
# un par nuevo en memoria al arrancar: sirve para desarrollo, pero los tokens
# dejan de valer cada vez que el servicio se reinicia.
app.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:}
app.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:}
